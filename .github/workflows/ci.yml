name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    strategy:
      matrix:
        node: [22, 24]
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Set release versions from tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: npm run release:prepare -- "$RELEASE_TAG"
        env:
          RELEASE_TAG: ${{ github.ref_name }}
      - run: npm run check
      - run: npm run test:package
